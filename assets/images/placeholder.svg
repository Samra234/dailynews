<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>

  <!-- Accent bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#accent)"/>

  <!-- Newspaper Icon -->
  <g transform="translate(340, 150)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#334155" stroke="#475569" stroke-width="3"/>
    <rect x="15" y="16" width="40" height="30" rx="4" fill="#dc2626" opacity="0.8"/>
    <line x1="65" y1="20" x2="105" y2="20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="32" x2="105" y2="32" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="44" x2="95" y2="44" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="15" y1="58" x2="105" y2="58" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="68" x2="105" y2="68" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="78" x2="75" y2="78" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title & Tagline -->
  <text x="400" y="290" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">
    DAILY NEWS
  </text>
  
  <text x="400" y="325" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Your World. Your News.
  </text>

  <rect x="375" y="348" width="50" height="3" rx="1.5" fill="#dc2626"/>

  <text x="400" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">
    Live Global Coverage
  </text>
</svg>
